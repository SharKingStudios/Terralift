# Terralift research configuration
# DWB controller + Smac 2D A* (course-tuned, valid)

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.14
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 12.0
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      holonomic_robot: true
      min_vel_x: -0.45
      max_vel_x: 1.22
      min_vel_y: -0.45
      max_vel_y: 0.75
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 1.22
      min_speed_theta: 0.0
      acc_lim_x: 0.8
      acc_lim_y: 0.8
      acc_lim_theta: 1.0
      decel_lim_x: -0.8
      decel_lim_y: -0.8
      decel_lim_theta: -1.0
      vx_samples: 16
      vy_samples: 16
      vtheta_samples: 18
      sim_time: 1.6
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      critics: [RotateToGoal, GoalAlign, PathAlign, PathDist, GoalDist, ObstacleFootprint]
      ObstacleFootprint:
        plugin: "dwb_critics::ObstacleFootprintCritic"
      ObstacleFootprint.scale: 0.08
      PathAlign.scale: 14.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 10.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 48.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.5
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 4.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 1.5
      motion_model_for_search: "MOORE"
      angle_quantization_bins: 1
      cost_travel_multiplier: 3.0
      debug_visualizations: false
      publish_expanded_nodes: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    stop_on_failure: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap
    global_costmap_topic: global_costmap/costmap
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 15.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.22, 1.22, 1.0]
    min_velocity: [-1.22, -1.22, -1.0]
    max_accel: [0.8, 0.8, 1.0]
    max_decel: [-0.8, -0.8, -1.0]
    odom_topic: /odom

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      always_send_full_costmap: false
      footprint_padding: 0.02
      robot_radius: 0.25
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_min_range: 0.15
          raytrace_max_range: 12.0
          obstacle_min_range: 0.15
          obstacle_max_range: 8.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.80
        cost_scaling_factor: 2.5

global_costmap:
  global_costmap:
    ros__parameters:
      width: 12
      height: 12
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      always_send_full_costmap: false
      footprint_padding: 0.02
      robot_radius: 0.25
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_min_range: 0.15
          raytrace_max_range: 12.0
          obstacle_min_range: 0.15
          obstacle_max_range: 8.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.90
        cost_scaling_factor: 2.2

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    transform_tolerance: 0.5
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_nav_safe
    state_topic: collision_monitor_state
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [ForwardSlow, RearSlow]
    ForwardSlow:
      type: "polygon"
      points: "[[0.48, 0.32], [0.48, -0.32], [-0.02, -0.32], [-0.02, 0.32]]"
      action_type: "slowdown"
      slowdown_ratio: 0.45
      min_points: 4
      visualize: false
      enabled: true
    RearSlow:
      type: "polygon"
      points: "[[-0.05, 0.22], [-0.05, -0.22], [-0.28, -0.22], [-0.28, 0.22]]"
      action_type: "slowdown"
      slowdown_ratio: 0.45
      min_points: 4
      visualize: false
      enabled: true
    observation_sources: [scan]
    scan:
      type: "scan"
      topic: /scan
      min_height: 0.0
      max_height: 2.0
      enabled: true

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_plugins: ['terralift_dock']
    terralift_dock:
      plugin: 'opennav_docking::SimpleNonChargingDock'
      docking_threshold: 0.10
      staging_x_offset: -0.5
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
    docks: ['home_dock']
    home_dock:
      type: 'terralift_dock'
      frame: map
      pose: [0.0, 0.0, 0.0]
      id: '00000000-0000-0000-0000-000000000000'

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 0.0
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - local_costmap
      - global_costmap
      - collision_monitor
      - docking_server
