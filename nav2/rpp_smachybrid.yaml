# Terralift course-tuned configuration
# Regulated Pure Pursuit + Smac Hybrid A*
#
# This version uses REEDS_SHEPP + allow_reversing so the global planner can
# generate reverse-capable paths and RPP can follow them.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 12.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.12
      movement_time_allowance: 12.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      max_linear_vel: 0.28
      min_linear_vel: -0.22
      max_angular_vel: 0.9
      min_angular_vel: -0.9
      max_linear_accel: 0.7
      max_linear_decel: -0.9
      max_angular_accel: 1.2
      max_angular_decel: -1.4

      use_velocity_scaled_lookahead_dist: true
      lookahead_dist: 0.40
      min_lookahead_dist: 0.18
      max_lookahead_dist: 0.55
      lookahead_time: 1.1
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.50
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.70

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.70
      cost_scaling_gain: 0.6
      regulated_linear_scaling_min_radius: 0.80
      regulated_linear_scaling_min_speed: 0.12
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.35

      # Nav2 docs note these cannot both be true.
      use_rotate_to_heading: false
      allow_reversing: true
      min_distance_to_obstacle: 0.10
      stateful: true
      use_dynamic_window: false
      allow_obstacle_checking_beyond_goal: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 3.0
    planner_plugins: [GridBased]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: false
      max_iterations: 200000
      max_on_approach_iterations: 2000
      max_planning_time: 2.5
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 64
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.5
      analytic_expansion_max_cost: 180.0
      analytic_expansion_max_cost_override: false
      minimum_turning_radius: 0.40
      reverse_penalty: 1.1
      change_penalty: 0.0
      non_straight_penalty: 1.1
      cost_penalty: 2.8
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 1
      goal_heading_mode: "BIDIRECTIONAL"

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    stop_on_failure: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap
    global_costmap_topic: global_costmap/costmap
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 12.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.28, 0.20, 0.9]
    min_velocity: [-0.22, -0.20, -0.9]
    max_accel: [0.7, 0.6, 1.2]
    max_decel: [-0.9, -0.8, -1.4]
    odom_topic: /odom

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6.0
      height: 6.0
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      always_send_full_costmap: false

      footprint_padding: 0.04
      robot_radius: 0.25

      plugins: [obstacle_layer, inflation_layer]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_min_range: 0.15
          raytrace_max_range: 12.0
          obstacle_min_range: 0.15
          obstacle_max_range: 8.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.80
        cost_scaling_factor: 2.3

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      width: 12.0
      height: 12.0
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      always_send_full_costmap: false

      footprint_padding: 0.04
      robot_radius: 0.25

      plugins: [static_layer, obstacle_layer, inflation_layer]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_min_range: 0.15
          raytrace_max_range: 12.0
          obstacle_min_range: 0.15
          obstacle_max_range: 8.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.90
        cost_scaling_factor: 2.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    transform_tolerance: 0.5
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_nav_safe
    state_topic: collision_monitor_state
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    polygons: [ForwardStop, ForwardSlow, RearStop]
    ForwardStop:
      type: "polygon"
      points: "[[0.34, 0.25], [0.34, -0.25], [0.06, -0.25], [0.06, 0.25]]"
      action_type: "stop"
      min_points: 4
      visualize: false
      enabled: true

    ForwardSlow:
      type: "polygon"
      points: "[[0.52, 0.34], [0.52, -0.34], [-0.02, -0.34], [-0.02, 0.34]]"
      action_type: "slowdown"
      slowdown_ratio: 0.40
      min_points: 4
      visualize: false
      enabled: true

    RearStop:
      type: "polygon"
      points: "[[-0.06, 0.22], [-0.06, -0.22], [-0.28, -0.22], [-0.28, 0.22]]"
      action_type: "stop"
      min_points: 4
      visualize: false
      enabled: true

    observation_sources: [scan]
    scan:
      type: "scan"
      topic: /scan
      min_height: 0.0
      max_height: 2.0
      enabled: true

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_plugins: ['terralift_dock']

    terralift_dock:
      plugin: 'opennav_docking::SimpleNonChargingDock'
      docking_threshold: 0.10
      staging_x_offset: -0.5
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false

    docks: ['home_dock']
    home_dock:
      type: 'terralift_dock'
      frame: map
      pose: [0.0, 0.0, 0.0]
      id: '00000000-0000-0000-0000-000000000000'

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 0.0
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - local_costmap
      - global_costmap
      - collision_monitor
      - docking_server
