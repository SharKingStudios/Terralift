# Small, conservative Nav2 profile for the 24 x 20 m Gazebo warehouse.
# The static map contains permanent walls only; live /scan feeds obstacle layers.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.30
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: -0.25
      max_vel_x: 0.55
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.55
      acc_lim_x: 0.6
      decel_lim_x: -0.6
      acc_lim_theta: 1.0
      decel_lim_theta: -1.0
      vx_samples: 15
      vtheta_samples: 15
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.04
      PathAlign.scale: 20.0
      PathDist.scale: 32.0
      GoalAlign.scale: 12.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 18.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 3.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.30
      allow_unknown: false
      max_iterations: 100000
      max_planning_time: 2.0
      motion_model_for_search: "MOORE"

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: "nav2_behaviors::Spin"}
    backup: {plugin: "nav2_behaviors::BackUp"}
    drive_on_heading: {plugin: "nav2_behaviors::DriveOnHeading"}
    wait: {plugin: "nav2_behaviors::Wait"}

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    stop_on_failure: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 15.0
    feedback: OPEN_LOOP
    max_velocity: [0.55, 0.0, 0.8]
    min_velocity: [-0.25, 0.0, -0.8]
    max_accel: [0.6, 0.0, 1.0]
    max_decel: [-0.6, 0.0, -1.0]
    odom_topic: /odom

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.05
      update_frequency: 8.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      robot_radius: 0.38
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.70
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      robot_radius: 0.38
      resolution: 0.05
      track_unknown_space: false
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 10.0
          raytrace_max_range: 12.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.75
        cost_scaling_factor: 3.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [controller_server, planner_server, behavior_server, bt_navigator, waypoint_follower, velocity_smoother]
