slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    mode: localization
    use_map_saver: true
    debug_logging: false

    scan_queue_size: 1
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 2.0
    resolution: 0.05
    publish_tf: true
    restamp_tf: true

    minimum_travel_distance: 0.08
    minimum_travel_heading: 0.08
    minimum_time_interval: 0.0

    min_laser_range: 0.08
    max_laser_range: 10.0

    do_loop_closing: false
    loop_search_maximum_distance: 2.5

    transform_timeout: 0.3
    tf_buffer_duration: 30.0

    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 6
    min_pass_through: 2
    occupancy_threshold: 0.15

    position_covariance_scale: 2.0
    yaw_covariance_scale: 2.0

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    stack_size_to_use: 40000000
    enable_interactive_mode: false
